<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 480" width="100%" height="100%">
  <!-- Floor Shadow -->
  <ellipse cx="175" cy="455" rx="110" ry="18" fill="#000000" opacity="0.3"/>

  <!-- 5-Star Base Feet & Caster Wheels -->
  <!-- Center Hub -->
  <circle cx="175" cy="420" r="18" fill="#1C1D21"/>
  <circle cx="175" cy="420" r="8" fill="#383B45"/>

  <!-- Base Legs -->
  <path d="M 175 420 L 70 440" stroke="#2D3039" stroke-width="12" stroke-linecap="round"/>
  <path d="M 175 420 L 280 440" stroke="#2D3039" stroke-width="12" stroke-linecap="round"/>
  <path d="M 175 420 L 115 450" stroke="#1C1D21" stroke-width="12" stroke-linecap="round"/>
  <path d="M 175 420 L 235 450" stroke="#1C1D21" stroke-width="12" stroke-linecap="round"/>
  <path d="M 175 420 L 175 460" stroke="#2D3039" stroke-width="12" stroke-linecap="round"/>

  <!-- Caster Wheels -->
  <circle cx="65" cy="442" r="9" fill="#0F1013"/>
  <circle cx="285" cy="442" r="9" fill="#0F1013"/>
  <circle cx="110" cy="452" r="9" fill="#0F1013"/>
  <circle cx="240" cy="452" r="9" fill="#0F1013"/>
  <circle cx="175" cy="462" r="9" fill="#0F1013"/>

  <!-- Pneumatic Gas Lift Column -->
  <rect x="167" y="340" width="16" height="80" rx="3" fill="#1C1D21"/>
  <rect x="170" y="320" width="10" height="30" fill="#9CA3AF"/>

  <!-- Seat Base Under Frame & Lever -->
  <rect x="135" y="310" width="80" height="15" rx="4" fill="#282A30"/>
  <path d="M 135 318 L 105 312" stroke="#1C1D21" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="311" r="5" fill="#10B981"/>

  <!-- Curved Armrests -->
  <!-- Left Armrest -->
  <path d="M 100 240 L 90 280 L 125 300" fill="none" stroke="#282A30" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="75" y="235" width="40" height="12" rx="6" fill="#15161A"/>

  <!-- Right Armrest -->
  <path d="M 250 240 L 260 280 L 225 300" fill="none" stroke="#282A30" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="235" y="235" width="40" height="12" rx="6" fill="#15161A"/>

  <!-- Padded Ergonomic Seat Cushion -->
  <path d="M 105 285 Q 175 270 245 285 L 250 310 Q 175 320 100 310 Z" fill="#1F2128"/>
  <path d="M 115 288 Q 175 278 235 288 L 240 305 Q 175 313 110 305 Z" fill="#2A2D37"/>

  <!-- Lumbar Support Arc -->
  <path d="M 125 210 Q 175 230 225 210" stroke="#10B981" stroke-width="6" fill="none" opacity="0.8" stroke-linecap="round"/>

  <!-- Mesh Backrest Frame & Pattern -->
  <path d="M 120 100 Q 175 80 230 100 L 240 260 Q 175 275 110 260 Z" fill="none" stroke="#282A30" stroke-width="14" stroke-linejoin="round"/>

  <!-- Mesh Pattern Fill -->
  <path d="M 126 106 Q 175 88 224 106 L 232 254 Q 175 267 118 254 Z" fill="#181920" opacity="0.95"/>
  <!-- Mesh Grill Lines -->
  <path d="M 130 130 Q 175 120 220 130 M 132 160 Q 175 150 218 160 M 134 190 Q 175 180 216 190 M 136 220 Q 175 210 214 220" stroke="#373A47" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Adjustable Ergonomic Headrest -->
  <rect x="165" y="65" width="20" height="30" rx="3" fill="#282A30"/>
  <rect x="135" y="35" width="80" height="35" rx="12" fill="#1F2128" stroke="#282A30" stroke-width="4"/>
  <rect x="145" y="42" width="60" height="21" rx="8" fill="#2A2D37"/>
