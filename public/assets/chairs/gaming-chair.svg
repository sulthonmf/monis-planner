  <path d="M 115 50 Q 175 40 235 50 L 245 275 Q 175 285 105 275 Z" fill="#0F172A"/>
  <path d="M 125 60 Q 175 52 225 60 L 232 265 Q 175 273 118 265 Z" fill="#1E293B"/>

