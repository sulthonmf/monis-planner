  <path d="M 260 230 L 260 290 L 225 310" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round"/>
  <rect x="235" y="220" width="45" height="15" rx="6" fill="#00F2FE"/>

  <!-- Racing Bucket Seat Cushion -->
  <path d="M 100 275 Q 175 260 250 275 L 255 310 Q 175 320 95 310 Z" fill="#0F172A"/>
  <path d="M 110 280 Q 175 270 240 280 L 244 305 Q 175 312 106 305 Z" fill="#1E293B"/>
