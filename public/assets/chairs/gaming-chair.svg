  <path d="M 175 420 L 70 440" stroke="#00F2FE" stroke-width="8" stroke-linecap="round"/>
  <path d="M 175 420 L 280 440" stroke="#00F2FE" stroke-width="8" stroke-linecap="round"/>
  <path d="M 175 420 L 115 450" stroke="#1E293B" stroke-width="8" stroke-linecap="round"/>
  <path d="M 175 420 L 235 450" stroke="#1E293B" stroke-width="8" stroke-linecap="round"/>
  <path d="M 175 420 L 175 460" stroke="#00F2FE" stroke-width="8" stroke-linecap="round"/>

  <!-- Wheels -->
  <circle cx="65" cy="442" r="9" fill="#020617"/>
  <circle cx="285" cy="442" r="9" fill="#020617"/>
  <circle cx="110" cy="452" r="9" fill="#020617"/>
  <circle cx="240" cy="452" r="9" fill="#020617"/>
  <circle cx="175" cy="462" r="9" fill="#020617"/>

