<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Wall Gradient -->
    <linearGradient id="loftWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B1E26"/>
      <stop offset="60%" stop-color="#242833"/>
      <stop offset="100%" stop-color="#2C313E"/>
    </linearGradient>

    <!-- Window Light Beam -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#93C5FD" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Concrete Floor Gradient -->
    <linearGradient id="loftFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232731"/>
      <stop offset="50%" stop-color="#191C23"/>
      <stop offset="100%" stop-color="#101217"/>
    </linearGradient>
  </defs>

  <!-- Loft Bedroom Wall -->
  <rect width="1200" height="580" fill="url(#loftWall)"/>

  <!-- Bedroom Window Light Cast -->
  <polygon points="0,0 450,0 750,580 0,580" fill="url(#windowLight)"/>

  <!-- Left Window Frame Silhouette -->
  <rect x="0" y="40" width="80" height="480" fill="#12141A" opacity="0.9"/>
  <line x1="0" y1="200" x2="80" y2="200" stroke="#252833" stroke-width="4"/>
  <line x1="0" y1="360" x2="80" y2="360" stroke="#252833" stroke-width="4"/>

  <!-- Right Bedroom Wall Art canvas -->
  <rect x="860" y="110" width="220" height="280" rx="4" fill="#14171F" stroke="#374151" stroke-width="3"/>
  <path d="M 880 340 L 960 220 L 1020 280 L 1060 210 L 1080 340 Z" fill="#3B82F6" opacity="0.3"/>
  <circle cx="1020" cy="180" r="22" fill="#F59E0B" opacity="0.4"/>

  <!-- Baseboard -->
  <rect x="0" y="565" width="1200" height="15" fill="#121419"/>

  <!-- Polished Concrete Floor -->
  <rect x="0" y="580" width="1200" height="220" fill="url(#loftFloor)"/>

  <!-- Minimalist Geometric Area Rug -->
  <ellipse cx="600" cy="690" rx="470" ry="85" fill="#1F2937" opacity="0.9" stroke="#6B7280" stroke-width="2"/>
</svg>
