<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Wall Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141622"/>
      <stop offset="70%" stop-color="#1A1D2D"/>
      <stop offset="100%" stop-color="#222638"/>
    </linearGradient>

    <!-- Floor Wood Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D221C"/>
      <stop offset="50%" stop-color="#201713"/>
      <stop offset="100%" stop-color="#150E0B"/>
    </linearGradient>

    <!-- Ambient Neon Cyan Glow -->
    <radialGradient id="cyanGlow" cx="20%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Neon Purple Glow -->
    <radialGradient id="purpleGlow" cx="80%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Light Drop -->
    <radialGradient id="centerLight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Hexagon Pattern -->
    <pattern id="hexPattern" width="40" height="69.282" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 20 11.547 L 0 0 L 0 23.094 L 20 34.641 L 40 23.094 Z" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
      <path d="M 40 34.641 L 20 46.188 L 0 34.641 L 0 57.735 L 20 69.282 L 40 57.735 Z" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Wall Background -->
  <rect width="1200" height="580" fill="url(#wallGrad)"/>

  <!-- Hexagon Acoustic Texture on Wall -->
  <rect width="1200" height="580" fill="url(#hexPattern)"/>

  <!-- LED Lighting Glow Layers -->
  <rect width="1200" height="580" fill="url(#cyanGlow)"/>
  <rect width="1200" height="580" fill="url(#purpleGlow)"/>
  <rect width="1200" height="580" fill="url(#centerLight)"/>

  <!-- Decorative Wall Elements (Bedroom / Gaming / Streamer vibes) -->
  <!-- LED Light Strips on Wall -->
  <path d="M 150 120 L 450 120" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" opacity="0.8" filter="drop-shadow(0 0 8px #00f2fe)"/>
  <path d="M 750 100 L 1050 100" stroke="#ff007f" stroke-width="3" stroke-linecap="round" opacity="0.8" filter="drop-shadow(0 0 8px #ff007f)"/>

  <!-- Floating Wall Shelves -->
  <rect x="150" y="160" width="220" height="10" rx="3" fill="#2A2E3D"/>
  <!-- Shelf Items (Headphone Stand, Plant, Trophy) -->
  <rect x="180" y="125" width="15" height="35" rx="3" fill="#3D4457"/>
  <circle cx="280" cy="140" r="15" fill="#10B981" opacity="0.7"/>
  <rect x="275" y="150" width="10" height="10" fill="#047857"/>

  <!-- Right Floating Wall Shelf -->
  <rect x="830" y="150" width="220" height="10" rx="3" fill="#2A2E3D"/>
  <rect x="860" y="120" width="40" height="30" rx="4" fill="#ff007f" opacity="0.4"/>
  <rect x="940" y="110" width="25" height="40" rx="3" fill="#3D4457"/>

  <!-- Wall Skirting Board / Baseboard -->
  <rect x="0" y="565" width="1200" height="15" fill="#11131B"/>

  <!-- Floor Area -->
  <rect x="0" y="580" width="1200" height="220" fill="url(#floorGrad)"/>

  <!-- Floor Planks Detail -->
  <line x1="0" y1="640" x2="1200" y2="640" stroke="#150E0B" stroke-width="1.5" opacity="0.6"/>
  <line x1="0" y1="710" x2="1200" y2="710" stroke="#150E0B" stroke-width="1.5" opacity="0.6"/>

  <!-- Bedroom Rug under Desk area -->
  <ellipse cx="600" cy="690" rx="450" ry="85" fill="#1E2333" opacity="0.75" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="2"/>
</svg>
