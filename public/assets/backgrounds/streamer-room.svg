<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Wall Gradient -->
    <linearGradient id="streamerWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191B22"/>
      <stop offset="70%" stop-color="#22252E"/>
      <stop offset="100%" stop-color="#2B2F3B"/>
    </linearGradient>

    <!-- Warm Lighting Center Glow -->
    <radialGradient id="warmCenterGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#FF7A00" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Gradient -->
    <linearGradient id="streamerFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A291E"/>
      <stop offset="50%" stop-color="#2B1D15"/>
      <stop offset="100%" stop-color="#1B110B"/>
    </linearGradient>
  </defs>

  <!-- Bedroom Wall -->
  <rect width="1200" height="580" fill="url(#streamerWall)"/>
  <rect width="1200" height="580" fill="url(#warmCenterGlow)"/>

  <!-- Acoustic Foam Panel Arrangement on Bedroom Wall -->
  <g opacity="0.35" transform="translate(480, 80)">
    <rect x="0" y="0" width="40" height="40" fill="#3A3F50" rx="4"/>
    <rect x="45" y="0" width="40" height="40" fill="#2D313F" rx="4"/>
    <rect x="90" y="0" width="40" height="40" fill="#3A3F50" rx="4"/>
    <rect x="135" y="0" width="40" height="40" fill="#2D313F" rx="4"/>
    <rect x="180" y="0" width="40" height="40" fill="#3A3F50" rx="4"/>

    <rect x="0" y="45" width="40" height="40" fill="#2D313F" rx="4"/>
    <rect x="45" y="45" width="40" height="40" fill="#F59E0B" opacity="0.6" rx="4"/>
    <rect x="90" y="45" width="40" height="40" fill="#2D313F" rx="4"/>
    <rect x="135" y="45" width="40" height="40" fill="#F59E0B" opacity="0.6" rx="4"/>
    <rect x="180" y="45" width="40" height="40" fill="#2D313F" rx="4"/>

    <rect x="0" y="90" width="40" height="40" fill="#3A3F50" rx="4"/>
    <rect x="45" y="90" width="40" height="40" fill="#2D313F" rx="4"/>
    <rect x="90" y="90" width="40" height="40" fill="#3A3F50" rx="4"/>
    <rect x="135" y="90" width="40" height="40" fill="#2D313F" rx="4"/>
    <rect x="180" y="90" width="40" height="40" fill="#3A3F50" rx="4"/>
  </g>

  <!-- Left Wall Art Frames -->
  <rect x="120" y="100" width="140" height="180" rx="4" fill="#14161D" stroke="#3A3F50" stroke-width="4"/>
  <rect x="135" y="115" width="110" height="150" fill="#252936"/>
  <circle cx="190" cy="170" r="30" fill="#F59E0B" opacity="0.3"/>

  <!-- Right Floating Wall Shelves -->
  <rect x="920" y="140" width="180" height="10" rx="3" fill="#3A3F50"/>
  <rect x="940" y="105" width="18" height="35" rx="2" fill="#60A5FA"/>
  <rect x="962" y="112" width="15" height="28" rx="2" fill="#F472B6"/>
  <rect x="980" y="108" width="18" height="32" rx="2" fill="#34D399"/>

  <!-- Baseboard -->
  <rect x="0" y="565" width="1200" height="15" fill="#15171E"/>

  <!-- Bedroom Wooden Floor -->
  <rect x="0" y="580" width="1200" height="220" fill="url(#streamerFloor)"/>
  <line x1="0" y1="650" x2="1200" y2="650" stroke="#1B110B" stroke-width="2" opacity="0.7"/>
  <line x1="0" y1="720" x2="1200" y2="720" stroke="#1B110B" stroke-width="2" opacity="0.7"/>

  <!-- Wool Rug -->
  <ellipse cx="600" cy="690" rx="480" ry="90" fill="#2D313F" opacity="0.8" stroke="#475569" stroke-width="2"/>
</svg>
