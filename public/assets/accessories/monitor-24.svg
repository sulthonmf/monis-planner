<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <!-- Leaf Screen Pattern Wallpaper -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shadow on Desk -->
  <ellipse cx="200" cy="270" rx="90" ry="8" fill="#000000" opacity="0.3"/>

  <!-- Monitor Base Plate -->
  <rect x="140" y="260" width="120" height="12" rx="4" fill="#1C1D21"/>
  <rect x="145" y="262" width="110" height="4" rx="2" fill="#374151"/>

  <!-- Monitor Stand Stem -->
  <path d="M 190 200 L 210 200 L 206 262 L 194 262 Z" fill="#282A30"/>

  <!-- Monitor Outer Bezel Frame -->
  <rect x="20" y="20" width="360" height="200" rx="8" fill="#111827"/>
  <rect x="23" y="23" width="354" height="194" rx="6" fill="#1F2937"/>

  <!-- Inner Active Display Screen -->
  <rect x="28" y="28" width="344" height="184" rx="4" fill="url(#screenGrad)"/>

  <!-- Tropical Leaf Wallpaper Graphic on Screen -->
  <path d="M 120 180 Q 80 120 140 80 Q 200 120 120 180 Z" fill="#10B981" opacity="0.6"/>
  <path d="M 280 180 Q 240 100 300 60 Q 350 110 280 180 Z" fill="#059669" opacity="0.7"/>
  <path d="M 200 190 Q 150 110 210 70 Q 260 110 200 190 Z" fill="#34D399" opacity="0.5"/>
  <line x1="120" y1="180" x2="140" y2="80" stroke="#047857" stroke-width="2"/>
  <line x1="280" y1="180" x2="300" y2="60" stroke="#022C22" stroke-width="2"/>

  <!-- Screen Gloss Reflection -->
  <rect x="28" y="28" width="344" height="184" rx="4" fill="url(#screenGlow)"/>

  <!-- Camera / Mic Sensor Top Bezel Dot -->
  <circle cx="200" cy="24" r="2" fill="#4B5563"/>
  <circle cx="200" cy="24" r="1" fill="#3B82F6"/>

  <!-- Brand Logo Bottom Bezel -->
  <rect x="190" y="213" width="20" height="3" rx="1" fill="#6B7280"/>
</svg>
