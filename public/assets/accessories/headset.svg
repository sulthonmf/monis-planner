<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 280" width="100%" height="100%">
  <!-- Headset Shadow -->
  <ellipse cx="125" cy="265" rx="55" ry="10" fill="#000000" opacity="0.25"/>

  <!-- Padded Headband Arch -->
  <path d="M 50 150 C 50 40 200 40 200 150" fill="none" stroke="#1F2937" stroke-width="22" stroke-linecap="round"/>
  <path d="M 65 140 C 65 60 185 60 185 140" fill="none" stroke="#374151" stroke-width="12" stroke-linecap="round"/>

  <!-- Headband Cushion Padding -->
  <path d="M 80 100 C 80 65 170 65 170 100" fill="none" stroke="#111827" stroke-width="14" stroke-linecap="round"/>

  <!-- Left Earcup Assembly -->
  <g transform="translate(50, 160)">
    <rect x="-20" y="-30" width="40" height="70" rx="18" fill="#1F2937"/>
    <rect x="-14" y="-24" width="28" height="58" rx="12" fill="#111827"/>
    <rect x="-10" y="-18" width="20" height="46" rx="8" fill="#374151"/>
    <!-- Accent Ring -->
    <rect x="-22" y="-5" width="6" height="20" rx="3" fill="#10B981"/>
  </g>

  <!-- Right Earcup Assembly -->
  <g transform="translate(200, 160)">
    <rect x="-20" y="-30" width="40" height="70" rx="18" fill="#1F2937"/>
    <rect x="-14" y="-24" width="28" height="58" rx="12" fill="#111827"/>
    <rect x="-10" y="-18" width="20" height="46" rx="8" fill="#374151"/>
    <!-- Accent Ring -->
    <rect x="16" y="-5" width="6" height="20" rx="3" fill="#10B981"/>
  </g>

  <!-- Flexible Microphone Boom Arm -->
  <path d="M 50 175 Q 30 220 75 230" stroke="#374151" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Foam Mic Pop Filter -->
  <rect x="70" y="222" width="18" height="16" rx="7" fill="#111827"/>
  <rect x="85" y="228" width="4" height="4" fill="#10B981"/>
</svg>
