<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <!-- Warm Lightbar Downlight Cone -->
    <linearGradient id="lightbarGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FACC15" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Downward Soft Eye-care Light Beam -->
  <polygon points="50,45 350,45 390,150 10,150" fill="url(#lightbarGlow)"/>

  <!-- Lightbar Mount Counterweight Clamp -->
  <rect x="185" y="45" width="30" height="25" rx="4" fill="#1F2937"/>
  <rect x="190" y="65" width="20" height="20" rx="3" fill="#111827"/>

  <!-- Aluminum Lightbar Tube Cylinder -->
  <rect x="30" y="32" width="340" height="14" rx="7" fill="#111827" stroke="#374151" stroke-width="2"/>
  <rect x="40" y="36" width="320" height="6" rx="3" fill="#FDE047"/>

  <!-- RGB Touch Controller Sensor Icon on Right Cap -->
  <circle cx="355" cy="39" r="3" fill="#00F2FE"/>
</svg>
