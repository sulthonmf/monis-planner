<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%" height="100%">
  <defs>
    <!-- RGB Underglow -->
    <filter id="rgbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
    </filter>
  </defs>

  <!-- RGB Ambient Backlight Underglow -->
  <rect x="15" y="15" width="290" height="90" rx="10" fill="#10B981" opacity="0.35" filter="url(#rgbGlow)"/>

  <!-- Shadow under Keyboard -->
  <rect x="15" y="20" width="290" height="88" rx="8" fill="#000000" opacity="0.4"/>

  <!-- Main Aluminum Keyboard Case -->
  <rect x="10" y="10" width="300" height="95" rx="10" fill="#1E2937" stroke="#374151" stroke-width="3"/>
  <rect x="16" y="16" width="288" height="83" rx="6" fill="#111827"/>

  <!-- Keycaps Layout Matrix (75% Mechanical Keyboard) -->
  <!-- Function Row (Top Row) -->
  <g fill="#374151" rx="2">
    <rect x="22" y="20" width="16" height="11" rx="2" fill="#10B981"/> <!-- Esc Key -->
    <rect x="42" y="20" width="14" height="11" rx="2"/>
    <rect x="58" y="20" width="14" height="11" rx="2"/>
    <rect x="74" y="20" width="14" height="11" rx="2"/>
    <rect x="90" y="20" width="14" height="11" rx="2"/>
    <rect x="110" y="20" width="14" height="11" rx="2"/>
    <rect x="126" y="20" width="14" height="11" rx="2"/>
    <rect x="142" y="20" width="14" height="11" rx="2"/>
    <rect x="158" y="20" width="14" height="11" rx="2"/>
    <rect x="178" y="20" width="14" height="11" rx="2"/>
    <rect x="194" y="20" width="14" height="11" rx="2"/>
    <rect x="210" y="20" width="14" height="11" rx="2"/>
    <rect x="226" y="20" width="14" height="11" rx="2"/>
    <rect x="246" y="20" width="16" height="11" rx="2" fill="#F59E0B"/>
    <rect x="266" y="20" width="16" height="11" rx="2" fill="#3B82F6"/>
    <rect x="286" y="20" width="14" height="11" rx="2"/>
  </g>

  <!-- Number Row -->
  <g fill="#1F2937" stroke="#4B5563" stroke-width="0.5">
    <rect x="22" y="34" width="16" height="12" rx="2"/>
    <rect x="40" y="34" width="16" height="12" rx="2"/>
    <rect x="58" y="34" width="16" height="12" rx="2"/>
    <rect x="76" y="34" width="16" height="12" rx="2"/>
    <rect x="94" y="34" width="16" height="12" rx="2"/>
    <rect x="112" y="34" width="16" height="12" rx="2"/>
    <rect x="130" y="34" width="16" height="12" rx="2"/>
    <rect x="148" y="34" width="16" height="12" rx="2"/>
    <rect x="166" y="34" width="16" height="12" rx="2"/>
    <rect x="184" y="34" width="16" height="12" rx="2"/>
    <rect x="202" y="34" width="16" height="12" rx="2"/>
    <rect x="220" y="34" width="16" height="12" rx="2"/>
    <rect x="238" y="34" width="16" height="12" rx="2"/>
    <rect x="256" y="34" width="24" height="12" rx="2" fill="#374151"/> <!-- Backspace -->
    <rect x="284" y="34" width="16" height="12" rx="2"/>
  </g>

  <!-- QWERTY Row -->
  <g fill="#1F2937" stroke="#4B5563" stroke-width="0.5">
    <rect x="22" y="48" width="22" height="12" rx="2" fill="#374151"/> <!-- Tab -->
    <rect x="46" y="48" width="16" height="12" rx="2"/>
    <rect x="64" y="48" width="16" height="12" rx="2"/>
    <rect x="82" y="48" width="16" height="12" rx="2"/>
    <rect x="100" y="48" width="16" height="12" rx="2"/>
    <rect x="118" y="48" width="16" height="12" rx="2"/>
    <rect x="136" y="48" width="16" height="12" rx="2"/>
    <rect x="154" y="48" width="16" height="12" rx="2"/>
    <rect x="172" y="48" width="16" height="12" rx="2"/>
    <rect x="190" y="48" width="16" height="12" rx="2"/>
    <rect x="208" y="48" width="16" height="12" rx="2"/>
    <rect x="226" y="48" width="16" height="12" rx="2"/>
    <rect x="244" y="48" width="16" height="12" rx="2"/>
    <rect x="262" y="48" width="18" height="12" rx="2"/>
    <rect x="284" y="48" width="16" height="12" rx="2"/>
  </g>

  <!-- ASDF Row -->
  <g fill="#1F2937" stroke="#4B5563" stroke-width="0.5">
    <rect x="22" y="62" width="26" height="12" rx="2" fill="#374151"/> <!-- Caps -->
    <rect x="50" y="62" width="16" height="12" rx="2"/>
    <rect x="68" y="62" width="16" height="12" rx="2"/>
    <rect x="86" y="62" width="16" height="12" rx="2"/>
    <rect x="104" y="62" width="16" height="12" rx="2"/>
    <rect x="122" y="62" width="16" height="12" rx="2"/>
    <rect x="140" y="62" width="16" height="12" rx="2"/>
    <rect x="158" y="62" width="16" height="12" rx="2"/>
    <rect x="176" y="62" width="16" height="12" rx="2"/>
    <rect x="194" y="62" width="16" height="12" rx="2"/>
    <rect x="212" y="62" width="16" height="12" rx="2"/>
    <rect x="230" y="62" width="16" height="12" rx="2"/>
    <rect x="248" y="62" width="32" height="12" rx="2" fill="#10B981"/> <!-- Enter -->
    <rect x="284" y="62" width="16" height="12" rx="2"/>
  </g>

  <!-- Bottom Spacebar Row -->
  <g fill="#374151">
    <rect x="22" y="76" width="24" height="14" rx="2"/>
    <rect x="48" y="76" width="22" height="14" rx="2"/>
    <rect x="72" y="76" width="22" height="14" rx="2"/>
    <rect x="96" y="76" width="112" height="14" rx="3" fill="#E5E7EB"/> <!-- Accent White Spacebar -->
    <rect x="210" y="76" width="20" height="14" rx="2"/>
    <rect x="232" y="76" width="20" height="14" rx="2"/>
    <rect x="254" y="76" width="14" height="14" rx="2" fill="#10B981"/> <!-- Arrow Left -->
    <rect x="270" y="76" width="14" height="14" rx="2" fill="#10B981"/> <!-- Arrow Down -->
    <rect x="286" y="76" width="14" height="14" rx="2" fill="#10B981"/> <!-- Arrow Right -->
  </g>
</svg>
