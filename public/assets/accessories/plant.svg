<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="100%" height="100%">
  <!-- Pot Drop Shadow -->
  <ellipse cx="120" cy="275" rx="55" ry="12" fill="#000000" opacity="0.3"/>

  <!-- Ceramic Pot Base -->
  <polygon points="85,190 155,190 145,265 95,265" fill="#1F2937"/>
  <ellipse cx="120" cy="190" rx="35" ry="8" fill="#374151"/>
  <!-- Soil -->
  <ellipse cx="120" cy="191" rx="32" ry="6" fill="#3D261A"/>

  <!-- Plant Stems -->
  <path d="M 120 190 Q 95 130 65 95" stroke="#047857" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 120 190 Q 145 120 175 85" stroke="#047857" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 120 190 Q 120 110 115 55" stroke="#059669" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 120 190 Q 85 150 50 140" stroke="#059669" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 120 190 Q 155 150 190 140" stroke="#059669" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Monstera Leaves -->
  <!-- Top Center Leaf -->
  <g transform="translate(115, 55) rotate(-5)">
    <path d="M 0 0 C -32 -22 -30 -65 0 -80 C 30 -65 32 -22 0 0 Z" fill="#10B981"/>
    <!-- Leaf Slits/Fenestrations -->
    <ellipse cx="-12" cy="-42" rx="3.5" ry="9" transform="rotate(-20 -12 -42)" fill="#1F2937" opacity="0.9"/>
    <ellipse cx="12" cy="-42" rx="3.5" ry="9" transform="rotate(20 12 -42)" fill="#1F2937" opacity="0.9"/>
    <ellipse cx="-10" cy="-24" rx="2.5" ry="7" transform="rotate(-15 -10 -24)" fill="#1F2937" opacity="0.9"/>
    <ellipse cx="10" cy="-24" rx="2.5" ry="7" transform="rotate(15 10 -24)" fill="#1F2937" opacity="0.9"/>
    <line x1="0" y1="0" x2="0" y2="-72" stroke="#047857" stroke-width="2.5"/>
  </g>

  <!-- Left Upper Leaf -->
  <g transform="translate(65, 95) rotate(-35)">
    <path d="M 0 0 C -28 -20 -25 -55 0 -68 C 25 -55 28 -20 0 0 Z" fill="#059669"/>
    <ellipse cx="-10" cy="-35" rx="2.5" ry="7" fill="#1F2937" opacity="0.9"/>
    <ellipse cx="10" cy="-35" rx="2.5" ry="7" fill="#1F2937" opacity="0.9"/>
    <line x1="0" y1="0" x2="0" y2="-62" stroke="#065F46" stroke-width="2"/>
  </g>

  <!-- Right Upper Leaf -->
  <g transform="translate(175, 85) rotate(35)">
    <path d="M 0 0 C -28 -20 -25 -55 0 -68 C 25 -55 28 -20 0 0 Z" fill="#10B981"/>
    <ellipse cx="-10" cy="-35" rx="2.5" ry="7" fill="#1F2937" opacity="0.9"/>
    <ellipse cx="10" cy="-35" rx="2.5" ry="7" fill="#1F2937" opacity="0.9"/>
    <line x1="0" y1="0" x2="0" y2="-62" stroke="#047857" stroke-width="2"/>
  </g>

  <!-- Left Lower Leaf -->
  <g transform="translate(50, 140) rotate(-55)">
    <path d="M 0 0 C -22 -16 -20 -45 0 -55 C 20 -45 22 -16 0 0 Z" fill="#34D399"/>
  </g>

  <!-- Right Lower Leaf -->
  <g transform="translate(190, 140) rotate(55)">
    <path d="M 0 0 C -22 -16 -20 -45 0 -55 C 20 -45 22 -16 0 0 Z" fill="#059669"/>
  </g>
</svg>
