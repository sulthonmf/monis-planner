<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 280" width="100%" height="100%">
  <defs>
    <!-- Leaf Screen Wallpaper -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <radialGradient id="screenGlowDual" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shadow on Desk -->
  <ellipse cx="325" cy="270" rx="140" ry="10" fill="#000000" opacity="0.35"/>

  <!-- Heavy Duty Dual Desk Clamp Mount -->
  <rect x="295" y="255" width="60" height="15" rx="3" fill="#1C1D21"/>
  <rect x="315" y="195" width="20" height="65" fill="#282A30"/>

  <!-- Left Monitor Arm -->
  <path d="M 315 200 L 160 170" stroke="#1C1D21" stroke-width="12" stroke-linecap="round"/>
  <!-- Right Monitor Arm -->
  <path d="M 335 200 L 490 170" stroke="#1C1D21" stroke-width="12" stroke-linecap="round"/>

  <!-- LEFT MONITOR -->
  <g transform="translate(10, 15)">
    <rect x="0" y="0" width="300" height="185" rx="6" fill="#111827"/>
    <rect x="4" y="4" width="292" height="177" rx="4" fill="url(#leafGrad)"/>
    <!-- Leaf graphics left screen -->
    <path d="M 90 170 Q 50 110 110 70 Q 170 110 90 170 Z" fill="#10B981" opacity="0.6"/>
    <path d="M 220 170 Q 180 90 240 50 Q 290 100 220 170 Z" fill="#059669" opacity="0.7"/>
    <rect x="4" y="4" width="292" height="177" rx="4" fill="url(#screenGlowDual)"/>
    <circle cx="150" cy="2" r="2" fill="#3B82F6"/>
  </g>

  <!-- RIGHT MONITOR -->
  <g transform="translate(340, 15)">
    <rect x="0" y="0" width="300" height="185" rx="6" fill="#111827"/>
    <rect x="4" y="4" width="292" height="177" rx="4" fill="url(#leafGrad)"/>
    <!-- Leaf graphics right screen -->
    <path d="M 90 170 Q 50 110 110 70 Q 170 110 90 170 Z" fill="#10B981" opacity="0.6"/>
    <path d="M 220 170 Q 180 90 240 50 Q 290 100 220 170 Z" fill="#059669" opacity="0.7"/>
    <rect x="4" y="4" width="292" height="177" rx="4" fill="url(#screenGlowDual)"/>
    <circle cx="150" cy="2" r="2" fill="#3B82F6"/>
  </g>
</svg>
